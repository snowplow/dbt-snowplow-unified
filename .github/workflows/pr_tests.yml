name: Temporary CWV version comparison

on:
  pull_request:
    types: [opened]

# Keep the existing group so other Unified CI runs cannot clear schemas mid-test.
concurrency: dbt_integration_tests
permissions:
  contents: read

jobs:
  cwv_bisect:
    if: github.head_ref == 'fix/databricks-cwv-regression' && github.event.pull_request.head.repo.full_name == github.repository
    name: CWV ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: integration_tests
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {label: september, core: '1.12.3', adapter: '1.12.5', dependencies: september}
          - {label: current, core: '1.12.5', adapter: '1.12.6', dependencies: october}
          - {label: old_pair, core: '1.12.3', adapter: '1.12.5', dependencies: october}
          - {label: adapter_only, core: '1.12.3', adapter: '1.12.6', dependencies: october}
          - {label: core_124, core: '1.12.4', adapter: '1.12.6', dependencies: october}
    env:
      DBT_PROFILES_DIR: ./ci/cwv_bisect
      CWV_SCHEMA: cwv_bisect_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.label }}
      DATABRICKS_TEST_HOST: ${{ secrets.DATABRICKS_TEST_HOST }}
      DATABRICKS_TEST_HTTP_PATH: ${{ secrets.DATABRICKS_TEST_HTTP_PATH }}
      DATABRICKS_TEST_TOKEN: ${{ secrets.DATABRICKS_TEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10.x'
      - name: Install controlled dependencies
        run: |
          python -m pip install 'dbt-core==${{ matrix.core }}' 'dbt-databricks==${{ matrix.adapter }}' -c ci/cwv_bisect/${{ matrix.dependencies }}.txt
          python -m pip check
          dbt --version
      - name: Run reduced CWV reproduction
        run: python ci/cwv_bisect/run.py run
      - name: Capture fixture mismatches and engine version
        if: always()
        run: python ci/cwv_bisect/run.py collect
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cwv-${{ matrix.label }}
          path: integration_tests/cwv_diagnostics/
          retention-days: 7
      - name: Remove this experiment's schemas
        if: always()
        run: python ci/cwv_bisect/run.py cleanup
