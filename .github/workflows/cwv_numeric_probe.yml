name: Temporary CWV SQL numeric probe
on:
  pull_request:
    types: [synchronize]
# Literal-only SELECT has no shared schemas or mutations.
concurrency: cwv_literal_numeric_probe
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'fix/databricks-cwv-regression' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABRICKS_TEST_HOST: ${{ secrets.DATABRICKS_TEST_HOST }}
      DATABRICKS_TEST_HTTP_PATH: ${{ secrets.DATABRICKS_TEST_HTTP_PATH }}
      DATABRICKS_TEST_TOKEN: ${{ secrets.DATABRICKS_TEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10.x'
      - name: Install SQL connector without dbt
        run: python -m pip install databricks-sql-connector==4.4.0 -c integration_tests/ci/cwv_bisect/october.txt
      - name: Execute candidate precision boundary regression
        run: python integration_tests/ci/cwv_bisect/numeric_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: cwv-sql-numeric-probe
          path: cwv-numeric-probe.json
          retention-days: 7
