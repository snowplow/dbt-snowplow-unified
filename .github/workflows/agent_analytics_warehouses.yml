name: Agent Analytics warehouse validation
on:
  pull_request:
    paths:
      - .github/workflows/agent_analytics_warehouses.yml
permissions:
  contents: read
concurrency:
  group: agent_analytics_warehouse_validation
  cancel-in-progress: false
env:
  # Set profiles.yml directory
  DBT_PROFILES_DIR: ./ci
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

  # BigQuery Connection
  BIGQUERY_TEST_DATABASE: ${{ secrets.BIGQUERY_TEST_DATABASE }}
  BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION }}
  BIGQUERY_SERVICE_TYPE: ${{ secrets.BIGQUERY_SERVICE_TYPE }}
  BIGQUERY_SERVICE_PROJECT_ID: ${{ secrets.BIGQUERY_SERVICE_PROJECT_ID }}
  BIGQUERY_SERVICE_PRIVATE_KEY_ID: ${{ secrets.BIGQUERY_SERVICE_PRIVATE_KEY_ID }}
  BIGQUERY_SERVICE_PRIVATE_KEY: ${{ secrets.BIGQUERY_SERVICE_PRIVATE_KEY }}
  BIGQUERY_SERVICE_CLIENT_EMAIL: ${{ secrets.BIGQUERY_SERVICE_CLIENT_EMAIL }}
  BIGQUERY_SERVICE_CLIENT_ID: ${{ secrets.BIGQUERY_SERVICE_CLIENT_ID }}
  BIGQUERY_SERVICE_AUTH_URI: ${{ secrets.BIGQUERY_SERVICE_AUTH_URI }}
  BIGQUERY_SERVICE_TOKEN_URI: ${{ secrets.BIGQUERY_SERVICE_TOKEN_URI }}
  BIGQUERY_SERVICE_AUTH_PROVIDER_X509_CERT_URL: ${{ secrets.BIGQUERY_SERVICE_AUTH_PROVIDER_X509_CERT_URL }}
  BIGQUERY_SERVICE_CLIENT_X509_CERT_URL: ${{ secrets.BIGQUERY_SERVICE_CLIENT_X509_CERT_URL }}

  # Snowflake Connection
  SNOWFLAKE_TEST_ACCOUNT: ${{ secrets.SNOWFLAKE_TEST_ACCOUNT }}
  SNOWFLAKE_TEST_USER: ${{ secrets.SNOWFLAKE_TEST_USER }}
  SNOWFLAKE_TEST_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_TEST_PRIVATE_KEY }}
  SNOWFLAKE_TEST_ROLE: ${{ secrets.SNOWFLAKE_TEST_ROLE }}
  SNOWFLAKE_TEST_DATABASE: ${{ secrets.SNOWFLAKE_TEST_DATABASE }}
  SNOWFLAKE_TEST_WAREHOUSE: ${{ secrets.SNOWFLAKE_TEST_WAREHOUSE }}

  # Databricks Connection
  DATABRICKS_TEST_CATALOG: ${{ vars.DATABRICKS_TEST_CATALOG || 'hive_metastore' }}
  DATABRICKS_TEST_HOST: ${{ secrets.DATABRICKS_TEST_HOST }}
  DATABRICKS_TEST_HTTP_PATH: ${{ secrets.DATABRICKS_TEST_HTTP_PATH }}
  DATABRICKS_TEST_TOKEN: ${{ secrets.DATABRICKS_TEST_TOKEN }}

jobs:
  validation:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'diagnose/agent-release-20261103' }}
    name: Agent Analytics (${{ matrix.warehouse }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        warehouse: [snowflake, bigquery, databricks]
    defaults:
      run:
        working-directory: agent_analytics/integration_tests
    env:
      DEFAULT_TARGET: ${{ matrix.warehouse }}
      SCHEMA_SUFFIX: native_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.warehouse }}
    steps:
      - name: Check out merged release candidate
        uses: actions/checkout@v4
        with:
          repository: snowplow-incubator/dbt-snowplow-agent-analytics
          ref: d01e6eaeb4864f24badddf8025b49f8c16acfec8
          path: agent_analytics
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install latest dbt 1.x
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --upgrade 'dbt-core==1.*' 'dbt-${{ matrix.warehouse }}==1.*'
          dbt --version
          dbt deps
      - name: Check warehouse connection
        id: connection
        run: dbt debug --target ${{ matrix.warehouse }}
      - name: Run existing integration suite
        run: bash .scripts/integration_tests.sh -d ${{ matrix.warehouse }}
      - name: Build and test Snowflake semantic layer
        if: matrix.warehouse == 'snowflake'
        run: |
          dbt build --target snowflake --select dim_date dim_page dim_operator agent_analytics_semantic_view --vars '{enable_semantic_views: true}'
      - name: Validate unpinned snapshot modes
        run: |
          cat > macros/validate_snapshot_date.sql <<'SQL'
          {% macro validate_snapshot_date(expected_date) %}
            {% set actual = run_query('select ' ~ snowplow_agent_analytics.as_of_date())[0][0] %}
            {% if actual | string != expected_date %}
              {{ exceptions.raise_compiler_error('Snapshot date differs: ' ~ actual ~ ' vs ' ~ expected_date) }}
            {% endif %}
            {{ log('Snapshot date matches calendar expectation: ' ~ actual, info=true) }}
          {% endmacro %}
          SQL
          python - <<'PYTHON'
          import datetime, json, os, subprocess
          today = datetime.datetime.now(datetime.timezone.utc).date()
          for mode in ('weekly', 'daily', 'latest'):
              expected = today - datetime.timedelta(days=today.weekday()) if mode == 'weekly' else today
              subprocess.run(['dbt', 'run-operation', 'validate_snapshot_date', '--target', os.environ['DEFAULT_TARGET'],
                  '--vars', json.dumps({'snowplow__as_of_date': None, 'summary_snapshot_mode': mode}),
                  '--args', json.dumps({'expected_date': str(expected)})], check=True)
          PYTHON
      - name: Generate dbt docs without publishing
        run: dbt docs generate --target ${{ matrix.warehouse }}
      - name: Clean isolated schemas
        if: ${{ always() && steps.connection.outcome == 'success' }}
        run: dbt run-operation post_ci_cleanup --target ${{ matrix.warehouse }}

  docs_validation:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'diagnose/agent-release-20261103' }}
    name: Agent Analytics docs (Snowflake)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agent_analytics/integration_tests
    env:
      DEFAULT_TARGET: snowflake
      SCHEMA_SUFFIX: docs_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
    - name: Check out merged release candidate
      uses: actions/checkout@v4
      with:
        repository: snowplow-incubator/dbt-snowplow-agent-analytics
        ref: d01e6eaeb4864f24badddf8025b49f8c16acfec8
        path: agent_analytics
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies as in native docs workflow
      run: |
        python -m pip install pip wheel setuptools
        python -m pip install 'dbt-snowflake==1.*' --upgrade
        dbt --version
        dbt deps
        jq --version
    - name: Check warehouse connection
      id: connection
      run: dbt debug --target snowflake
    - name: Create dbt docs
      run: |
        dbt run-operation post_ci_cleanup --target snowflake
        dbt seed --target snowflake --full-refresh
        # The stg model is read through source(), not ref(), so dbt can't order it -- build it first
        dbt run --target snowflake --select snowplow_agent_analytics_events_stg
        dbt run --target snowflake --full-refresh --exclude snowplow_agent_analytics_events_stg --vars '{snowplow__backfill_limit_days: 120}'
        dbt docs generate --target snowflake --vars '{snowplow__backfill_limit_days: 120}'
        mkdir -p ../docs
        rm -f ../docs/catalog.json ../docs/manifest.json ../docs/run_results.json ../docs/index.html
        # Drop the integration test project's own nodes (fixture seeds, *_actual/*_expected
        # models, equality tests) so the site documents only the package.
        jq 'walk(if type == "object" then with_entries(select(.key | contains("snowplow_agent_analytics_integration_tests") | not)) else . end)' target/manifest.json > target/new_manifest.json
        jq 'walk(if type == "object" then with_entries(select(.key | contains("snowplow_agent_analytics_integration_tests") | not)) else . end)' target/catalog.json > target/new_catalog.json
        cp target/new_catalog.json ../docs/catalog.json
        cp target/new_manifest.json ../docs/manifest.json
        cp target/run_results.json ../docs/run_results.json
        cp target/index.html ../docs/index.html
    - name: Preserve generated package docs without publishing
      uses: actions/upload-artifact@v4
      with:
        name: agent-analytics-0.2.0-dbt-docs
        path: |
          agent_analytics/docs/index.html
          agent_analytics/docs/manifest.json
          agent_analytics/docs/catalog.json
          agent_analytics/docs/run_results.json
        if-no-files-found: error
        retention-days: 7
    - name: Clean isolated schemas
      if: ${{ always() && steps.connection.outcome == 'success' }}
      run: dbt run-operation post_ci_cleanup --target snowflake
